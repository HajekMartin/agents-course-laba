name: finance-assistant-02

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env first; see README.md}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Generate .env first; see README.md}
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-finance}
      FINANCE_DB_USER: ${FINANCE_DB_USER:-finance_app}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Generate .env first; see README.md}
      TZ: ${TIMEZONE:-Europe/Prague}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - finance
    healthcheck:
      # TCP is unavailable during the image's temporary initialization server.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres
          && PGPASSWORD="$${N8N_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${N8N_DB_USER}" -d "$${N8N_DB_NAME}" -Atqc 'SELECT 1' > /dev/null
          && PGPASSWORD="$${FINANCE_DB_PASSWORD}" psql -h 127.0.0.1 -U "$${FINANCE_DB_USER}" -d "$${FINANCE_DB_NAME}" -Atqc 'SELECT 1' > /dev/null
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    stop_grace_period: 30s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Generate .env first; see README.md}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Generate .env first; see README.md}
      N8N_HOST: ${N8N_HOST:-localhost}
      # Internal port is fixed. N8N_PORT configures the host port and advertised URLs.
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      N8N_WEBHOOK_URL: http://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Prague}
      TZ: ${TIMEZONE:-Europe/Prague}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_PYTHON_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      N8N_PERSONALIZATION_ENABLED: "false"
      # Keep the built-in MCP module available; owner activation and OAuth are manual.
      N8N_DISABLED_MODULES: ""
      N8N_MCP_COMMUNITY_NODE_DISCOVERY_ENABLED: "false"
      UNSLOTH_BASE_URL: ${UNSLOTH_BASE_URL:-http://host.docker.internal:8888/v1}
      UNSLOTH_MODEL: ${UNSLOTH_MODEL:-your-model-id}
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config/verify-unsloth.mjs:/opt/finance/verify-unsloth.mjs:ro
    networks:
      - finance
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz/readiness', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    stop_grace_period: 30s

networks:
  finance:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
